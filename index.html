<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine</title>
    <link rel="stylesheet" href="css/valentine.css" />
  </head>
  <body>
    <div id="valentineQuestion"><b>Charmaine, will you please be my Valentine?</b></div>

    <div class="buttonRow">
      <button class="answerButton" onclick="location.href='thankyou.html'">
        Yes
      </button>
      <button class="answerButton" id="noButton">No</button>
    </div>
    <br />
    <img src="bubu-dudu.gif" alt="bubu dubu asking question" class="responsive" />

    <script>
      let noClickCount = 1;

      document
        .getElementById("noButton")
        .addEventListener("click", function () {
          var yesButton = document.querySelector(
            'button[onclick*="thankyou.html"]'
          );
          var currentFontSize = parseInt(
            window.getComputedStyle(yesButton).fontSize
          );
          yesButton.style.fontSize = currentFontSize + 10 + "px"; // Increase font size by 5px

          if (noClickCount === 0) {
            this.textContent = "No";
          } else {
            this.textContent = "Button broken";
          }

          noClickCount++;
        });
    </script>
  </body>
</html>
